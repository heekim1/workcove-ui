services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile_prod
      args:
        APP_USER: ${APP_USER:-app}
        APP_UID: ${APP_UID:-1000}
    ports:
      - "3000:3000"
    env_file:
      - ./.env_dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped
    volumes:
      - .:/app
      - ui_node_modules:/app/node_modules
    networks:
      - workcove

volumes:
  ui_node_modules:

networks:
  workcove:
    driver: bridge
